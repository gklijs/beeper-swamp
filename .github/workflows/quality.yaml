name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install swamp
        run: |
          SWAMP_VERSION="$(grep '^swampVersion:' .swamp.yaml | awk '{print $2}')"
          curl -fsSL https://swamp-club.com/install.sh | sh -s -- -V "$SWAMP_VERSION"
          echo "$HOME/.swamp/bin" >> "$GITHUB_PATH"
      - name: Format and lint
        run: |
          if [ -z "$SWAMP_API_KEY" ]; then echo "No SWAMP_API_KEY, skipping."; exit 0; fi
          swamp extension fmt manifest.yaml --check
        env:
          SWAMP_API_KEY: ${{ secrets.SWAMP_API_KEY }}
          SWAMP_SIGNIN_TOKEN: ${{ secrets.SWAMP_SIGNIN_TOKEN }}
      - name: Unit tests
        run: deno test --allow-net --allow-read extensions/behaviors/beeper_test.ts
      - name: Quality gate
        run: |
          if [ -z "$SWAMP_API_KEY" ]; then echo "No SWAMP_API_KEY, skipping."; exit 0; fi
          swamp extension quality manifest.yaml
        env:
          SWAMP_API_KEY: ${{ secrets.SWAMP_API_KEY }}
          SWAMP_SIGNIN_TOKEN: ${{ secrets.SWAMP_SIGNIN_TOKEN }}
