name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install swamp
        run: |
          curl -fsSL https://swamp-club.com/install.sh | sh
          echo "$HOME/.swamp/bin" >> "$GITHUB_PATH"
      - name: Format and lint
        if: ${{ secrets.SWAMP_API_KEY != '' }}
        run: swamp extension fmt manifest.yaml --check
        env:
          SWAMP_API_KEY: ${{ secrets.SWAMP_API_KEY }}
          SWAMP_SIGNIN_TOKEN: ${{ secrets.SWAMP_SIGNIN_TOKEN }}
      - name: Unit tests
        run: deno test --allow-net --allow-read extensions/behaviors/beeper_test.ts
      - name: Quality gate
        if: ${{ secrets.SWAMP_API_KEY != '' }}
        run: swamp extension quality manifest.yaml
        env:
          SWAMP_API_KEY: ${{ secrets.SWAMP_API_KEY }}
          SWAMP_SIGNIN_TOKEN: ${{ secrets.SWAMP_SIGNIN_TOKEN }}
